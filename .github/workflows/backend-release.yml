name: Release PaperBrain Backend

on:
  push:
    tags:
      - "backend-*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: Validate backend
        run: python script/paperbrain.py check --strict-lint
      - name: Build backend distributions
        run: python -m build
      - name: Verify version and prepare release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#backend-}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"
          wheel="dist/paperbrain-${version}-py3-none-any.whl"
          test -s "$wheel"
          cp script/requirements.lock dist/requirements.lock
          (cd dist && sha256sum "$(basename "$wheel")" requirements.lock > backend-checksums.txt)
      - name: Publish backend assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/paperbrain-*.whl dist/requirements.lock dist/backend-checksums.txt
          --verify-tag
          --title "PaperBrain Backend ${GITHUB_REF_NAME#backend-}"
          --generate-notes
