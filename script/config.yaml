doubao:
  api_key: "${DOUBAO_API_KEY}"
  # You can use doubao-seed-2-0-lite-260215 for cheaper screening
  model_flash: "ep-20260226105946-sgmhx"
  # Use the powerful Pro model for detailed analysis
  model_pro: "ep-20260226105946-sgmhx"
  threshold_score: 7

openrouter:
  api_key: "${OPENROUTER_API_KEY}"
  model_flash: "qwen/qwen3.6-plus"
  model_screening_pro: "deepseek/deepseek-v4-pro"
  model_pro: "deepseek/deepseek-v4-pro"
  threshold_score: 7



analysis:
  max_iterations: 2
  max_papers_per_day: 2
  screening_second_stage_top_k: 10
  screening_second_stage_use_pdf_context: true
  screening_second_stage_pdf_context_pages: 3
  screening_second_stage_pdf_context_max_chars: 5000
  screening_weights:
    relevance: 0.30
    novelty: 0.23
    rigor: 0.22
    evidence: 0.15
    reproducibility: 0.10
  depth_level: "Deep"
  focus_areas:
    - "Academic Quality Assessment"
    - "Relevance & Contribution"
    - "Methodology Rigor"
  citation_style: "APA"
  scoring_rubric:
    venue_weight: 0.3
    methodology_weight: 0.4
    innovation_weight: 0.3
  # Prompts have been moved to script/prompts.yaml
  # analysis.prompts is kept as an empty placeholder for backward compatibility

obsidian:
  vault_path: "../"  # Path to your Obsidian Vault root (Parent Directory)
  daily_digest_folder: "Daily_Papers"
  detailed_notes_folder: "Research_Notes"
  themes_folder: "Research_Themes"
  pdf_storage_folder: "PDFs"  # New folder for storing PDFs
  daily_digest_template: |
    # 📅 {{date}} - Paper Digest
    ## Summary
    Total Papers: {{total_count}} | High Impact: {{high_impact_count}}
    
    ## 📝 Papers List
    {{content}}

theme_enrichment:
  enabled: true
  openrouter_model: "deepseek/deepseek-v4-pro"
  doubao_model: "ep-20260226105946-sgmhx"
  temperature: 0.2
  max_tokens: 4000

search:
  keywords:
    - "Robot Manipulation"
    - "VLA"
    - "World Model"
    - "Reinforcement Learning"
    - "Diffusion model"
    - "Embodied AI"
    - "Foundation Models"
    - "LLM"
  max_results: 50
  arxiv_categories:
    - "cs.RO"
    - "cs.AI"
    - "cs.LG"
    - "cs.CV"

schedule:
  time: "12:00"  # 24-hour format
