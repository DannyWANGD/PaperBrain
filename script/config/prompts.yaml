# PaperBrain prompt configuration
# Keep placeholders in {name} format for templates that are formatted by Python.
# Escape literal JSON braces only inside formatted templates.

screening:
  coarse_system: "You are a careful research triage assistant. Be conservative, fast, and structured."
  coarse_user: |
    You are performing the FIRST-PASS coarse screening for a robotics/AI paper pipeline.
    Evaluate whether this paper is promising enough to enter a stricter second-stage review for these interests: {keywords}.

    Title: {title}
    Abstract: {abstract}

    {taxonomy_block}

    Score each dimension from 1.0-10.0 using one decimal place:
    - relevance: how well the paper matches the target interests.
    - evidence: how much concrete empirical/theoretical support is visible from the abstract.
    - method_completeness: whether the abstract describes a real method with enough mechanism detail to justify deeper review.

    Decision goal:
    - This is not the final accept/reject decision.
    - Be recall-oriented for high-potential work, but still filter obvious weak matches, shallow papers, and poorly supported work.
    - If the abstract is vague, underspecified, or clearly off-topic, set should_rescreen to false.

    Return JSON only:
    {{
      "coarse_score": number,
      "relevance": number,
      "evidence": number,
      "method_completeness": number,
      "should_rescreen": bool,
      "reason": "one concise sentence"
    }}

  detailed_system: "You are a senior research reviewer. Be objective, critical, conservative, and use consistent scoring standards."
  detailed_user: |
    You are performing the SECOND-PASS rigorous screening for a robotics/AI research workflow.
    Evaluate expected research value for these interests: {keywords}.

    Title: {title}
    Abstract: {abstract}
    {doc_context_block}

    {taxonomy_block}

    Score each dimension from 1.0-10.0 using one decimal place:
    - relevance: fit to the target interests and application scope.
    - novelty: originality versus common baseline ideas.
    - rigor: methodological soundness and evaluation quality.
    - evidence: strength of empirical/theoretical support.
    - reproducibility: clarity of setup, assumptions, and implementability.

    Calibration:
    - Treat the final score as a research-priority score, not as a paper-acceptance score.
    - Do not let novelty alone compensate for poor relevance, weak evidence, or unclear methodology.
    - If relevance <= 4, overall score must be <= 6.
    - If rigor <= 4 or evidence <= 4, overall score must be <= 7.
    - If confidence <= 4, overall score must be <= 7.
    - If the paper lacks concrete method/evaluation details, reduce confidence and avoid optimistic scoring.
    - If the PDF excerpt is provided, use it to judge rigor/evidence/reproducibility.
    - Use red_flags for concrete risks only: missing baselines, vague evaluation, data leakage risk, unsupported claims, unclear task setup, weak reproducibility, or mismatch with the target research interests.
    - If abstract and excerpt conflict, prefer concrete technical details from the excerpt and lower confidence if the inconsistency is severe.

    Return JSON only:
    {{
      "score": number,
      "relevance": number,
      "novelty": number,
      "rigor": number,
      "evidence": number,
      "reproducibility": number,
      "confidence": number,
      "red_flags": ["string"],
      "innovation": "one concrete technical sentence",
      "limitations": "one concrete technical sentence",
      "reason": "one concise sentence mentioning key drivers of score",
      "tags": ["specific_tag", "specific_tag", "specific_tag"],
      "short_title": "English_safe_short_title"
    }}

analysis:
  system_role: |
    You are a patient senior research mentor helping a student understand advanced AI and robotics papers.
    Your writing must be accurate, clear, and easy to study. Prefer plain English over ornate academic language.
    Do not hype the paper. Separate what the paper proves from what you infer.
    Every subsection must be written as complete paragraphs, not fragmented bullet lists.
    Your job is to turn a difficult paper into an Obsidian note that supports reading, review, comparison, and future research ideas.

  deep_analysis: |
    Please produce a deep but student-friendly reading note for the provided paper.

    Your goal is not to sound impressive. Your goal is to help a student understand the paper well enough to explain it, critique it, and decide what to study or reproduce next.

    Critical writing rules:
    1. Write in English only.
    2. Use complete paragraphs. Do not compress a major point into one huge paragraph. Break each major section into several focused paragraphs or subsections, normally 3-6 sentences per paragraph.
    3. Explain each major point from multiple angles: motivation, mechanism, evidence, limitation, and reading implication when applicable.
    4. Avoid fragmented bullet-only output. Bullets are allowed only for compact lists such as datasets, metrics, variables, equations, implementation details, or short checklists.
    5. Use clear terms before technical terms. When a term is important, define it in plain English.
    6. Label uncertainty. If the provided paper text does not support a claim, write "Not clear from the provided text" instead of guessing.
    7. Separate paper claims, evidence, your interpretation, and open questions when this distinction matters.
    8. Keep equations useful. For every equation, explain what each symbol means, why the equation is included, and what optimizing or computing it does in practice.
    9. When discussing figures or tables, explain what question the figure/table answers, what evidence it provides, and what caveat remains.
    10. Use a three-pass reading style: first identify the problem, contribution, and evidence; then trace the method; finally inspect formulas, ablations, assumptions, and reproducibility details.

    Obsidian formatting rules:
    - Use standard Markdown headings only. Do not add a top-level title.
    - Use Obsidian-compatible emphasis: `**bold**` for important terms, `*italic*` for gentle emphasis, and `==highlight==` only for the most important takeaway in a section.
    - Use Obsidian-compatible callouts when they add value, for example `> [!NOTE]`, `> [!TIP]`, `> [!WARNING]`, or `> [!QUESTION]`. Keep callouts short and useful.
    - Use inline math with single dollar signs only, for example $s_t$, $a_t$, or $p(a_t \mid s_t)$. Do not wrap inline math in backticks.
    - Use display math with double dollar signs only for central objectives, losses, probabilistic models, or update rules. Put display math on its own lines:
      $$
      L = L_{\text{task}} + \lambda L_{\text{reg}}
      $$
    - Use backticks only for code, commands, filenames, property names, model IDs, tags, or literal syntax examples. Never put mathematical equations inside backticks unless you are explicitly discussing code that contains the equation.
    - For suitable, meaningful knowledge points that require extra study or extra reading to understand well, provide related learning links directly in the note. These may include web pages, official documentation, blogs, tutorials, project pages, datasets, benchmarks, or code repositories.
    - Use Obsidian-compatible Markdown website links, such as `[concept guide](https://example.com)`, `[official documentation](https://example.com)`, `[blog explanation](https://example.com)`, or `[code repository](https://github.com/example/repo)`. Add links only when they genuinely help the student learn a prerequisite, method, benchmark, dataset, library, or implementation detail. Do not fabricate URLs; if you are unsure of a precise URL, omit the link rather than guessing.
    - Do not use unsupported HTML or decorative formatting.

    Start with this metadata JSON block exactly:
    ```json
    {
      "publication_date": "YYYY-MM-DD or Unknown",
      "institutions": ["Institution 1", "Institution 2"],
      "github": "URL or None",
      "project_page": "URL or None"
    }
    ```

    Then write the note with exactly these section headers:

    ## Abstract
    Include the original English abstract if available. After the abstract, add one short paragraph explaining the abstract in simpler words. Keep this section readable, not overly long.

    ## 1. Core Snapshot
    This section must preserve and integrate the following three subsections exactly.

    ### Problem Statement
    Explain the problem in plain English. Clarify what the input, output, target behavior, and real bottleneck are. If the problem is narrow, say so directly.

    ### Core Contribution
    Explain the central contribution as a concrete technical claim, not a vague summary. Describe what the authors add, what changes compared with common prior approaches, and what evidence supports the claim.

    ### Innovation Origin & Rationale
    Explain where the idea seems to come from and why it is reasonable. Connect the design to the failure mode or limitation it is meant to fix. If this rationale is your interpretation rather than an explicit paper claim, label it as interpretation.

    ## 2. Reading Map
    Give a compact but complete reading guide. Explain the paper's task/domain, what kind of reader should care, which sections deserve careful reading, and what can be skimmed on a first pass. This should read like a researcher's navigation map, not a marketing summary.

    ## 3. Method Walkthrough
    Explain the method as a connected story from input to output.

    ### Inputs, Outputs, And Assumptions
    Describe what the method receives, what it predicts or controls, and what assumptions it depends on. Explain why these assumptions matter for the method's validity.

    ### Pipeline From Data To Prediction
    Walk through the pipeline step by step. Each step should be a paragraph that explains what happens, why it happens, and what information is transformed.

    ### Key Design Choices
    For each important design choice, explain what it does, why the authors likely chose it, what simpler alternative exists, and what could go wrong without it.

    ## 4. Core Theory And Formulas
    This is the main technical understanding section. Use Obsidian-compatible math generously but responsibly.

    ### Main Objective
    Explain the core objective in words first. Then write the central loss, optimization target, probabilistic model, dynamics equation, policy objective, or scoring rule if it is available in the paper.

    ### Important Equations
    For each important equation, include the equation in display math when possible, then explain every variable in plain English. Also explain the intuition: what increases the value, what decreases it, and why the equation matters for the paper's method.

    ### Algorithmic Intuition
    Translate algorithms or update rules into plain procedural steps. If the paper has no explicit equations, create only faithful interpretive equations when they help understanding, and label them as "Interpretive equation".

    ## 5. Architecture, Figures, And Implementation
    Explain the architecture components, figure evidence, and implementation details. If a figure shows the method pipeline, describe the data flow visually in prose. If implementation details are missing, say exactly what is missing.

    ## 6. Experiments And Evidence
    Summarize the datasets, benchmarks, baselines, metrics, main results, and ablations. Do not only list numbers; explain what question each experiment answers. If exact numbers are available, include them. If an expected baseline or ablation is missing, say why that weakens the evidence.

    ## 7. Strengths, Limitations, And Failure Cases
    Explain the main strengths as supported by the paper's evidence. Then explain limitations, failure cases, hidden assumptions, scalability concerns, and deployment hurdles. Be specific and fair. Avoid generic statements such as "needs more data" unless the paper provides evidence for that.

    ## 8. Reproduction Notes
    Extract practical information needed for reproduction: datasets, preprocessing, model/backbone, training protocol, evaluation protocol, metrics, baselines, hyperparameters, compute assumptions, code/data availability, and missing implementation details. If some information is absent, mark it explicitly.

    ## 9. What To Read Closely
    Tell the student which sections, figures, tables, equations, or ablations deserve close reading first and why. Also mention what can be skimmed if the reader only has limited time.

    ## 10. Research Ideas And Open Questions
    Propose three concrete follow-up ideas. Each idea must be a full paragraph that explains the motivation, a small experiment that could be done in one or two weeks, the metric or observation to check, and the risk that could invalidate the idea.

  round1_suffix: |
    Context: The paper text is provided as plain text. Key figures may be provided as images. Use the figures when discussing architecture, data flow, or visual results.

    Mandatory formatting:
    - Do not output a top-level title like "# Deep Analysis Report".
    - Start directly with the metadata JSON block, then "## Abstract".
    - All prose must be in English.
    - Use the exact section headers requested above.
    - Preserve the "## 1. Core Snapshot" section and its three required subsections exactly: "### Problem Statement", "### Core Contribution", and "### Innovation Origin & Rationale".
    - Every subsection must include complete paragraphs, not only bullets.
    - Avoid giant paragraphs. After one or two conceptual moves, start a new paragraph.
    - The "## 4. Core Theory And Formulas" section must include Obsidian-compatible inline math `$...$` and display math `$$...$$` when formulas or objectives exist in the paper, but do not wrap the formulas in backticks.
    - For meaningful concepts that need extra learning to understand, include relevant web pages, blogs, tutorials, project pages, datasets, benchmarks, or GitHub repositories using Obsidian-compatible Markdown links. Do not invent URLs.
    - Before finalizing, check that the note is accurate, clear, student-friendly, well segmented, and not fragmented.

  refinement_user: |
    You are revising a first draft of a deep paper reading note into the final Obsidian note.

    Paper title:
    {paper_title}

    Paper text excerpt for fact checking:
    {paper_excerpt}

    Draft note:
    {draft_note}

    Revise the draft systematically and return the improved note only. Do not add a metadata JSON block and do not wrap the note in a code fence.

    Required improvements:
    - Preserve the exact main section structure from the draft, especially "## 1. Core Snapshot" with "### Problem Statement", "### Core Contribution", and "### Innovation Origin & Rationale".
    - Split any huge paragraph into several clear paragraphs. Each major point should be explained from multiple angles: motivation, mechanism, evidence, limitation, and reading implication when relevant.
    - Strengthen "## 4. Core Theory And Formulas" with Obsidian-compatible inline math using single dollar signs and display math using double dollar signs. Explain every symbol and the practical meaning of each equation.
    - Do not put math formulas inside backticks or fenced code blocks. Backticks are only for code, commands, filenames, property names, tags, model IDs, and literal syntax examples.
    - Add or improve short Obsidian callouts only when they help the student notice a key point, uncertainty, warning, or question.
    - For suitable, meaningful knowledge points that require extra study or extra reading to understand well, add related learning links such as web pages, blogs, tutorials, project pages, datasets, benchmarks, or repositories. Use Obsidian-compatible Markdown links like `[concept guide](https://example.com)`. Do not invent URLs.
    - Use `**bold**`, `*italic*`, and `==highlight==` sparingly and correctly. Highlight only the most important takeaway in a section.
    - Keep all prose in English. Use complete paragraphs. Avoid a pile of disconnected bullets.
    - Do not invent facts. If the excerpt or draft does not support a detail, write "Not clear from the provided text".
    - Keep wording accurate, clear, and readable for a student.

    Quality checklist before returning:
    - Does every major section have readable paragraph breaks?
    - Does the Core Snapshot include the three required subsections?
    - Are formulas written in Obsidian-compatible math syntax and explained in words?
    - Are claims, evidence, interpretation, and uncertainty clearly separated?
    - Does the final note begin with "## Abstract"?

  round2_user: |
    Based on the reading note above, now add a connection and reflection section.

    Writing rules:
    - Write in English only.
    - Use complete paragraphs.
    - Keep technical terms precise but explain them clearly.
    - Use [[Wiki-Link]] format for related notes when possible.

    Related notes from my knowledge base:
    {context_notes}

    Write exactly these sections:

    ### Related Work Connections
    Connect this paper to up to three related notes from my knowledge base. For each connection, explain the shared problem or method, how the new paper differs, and what the difference implies. If the related note list is weak or not truly relevant, say so rather than forcing a connection.

    ### Concept Map
    Generate one Mermaid graph (`graph LR`) that shows the paper's core pipeline and its strongest knowledge-base connections. Use English-only node IDs and labels. Keep the graph small enough to render reliably in Obsidian.

    ### Questions For Future Reading
    Write three thoughtful questions that I should keep in mind while reading future papers in this area. Each question should explain why it matters and what kind of evidence would answer it.

  abstract_fallback_user: |
    Generate a concise English reading note using only the title, abstract, and related notes context.
    Mark missing evidence as "Unknown from abstract".

    Title: {title}
    Abstract: {abstract}

    Related notes context:
    {rag_context}

    Use these sections:
    ## Core Snapshot
    ### Problem Statement
    ### Core Contribution
    ### Innovation Origin & Rationale
    ## Method Sketch
    ## Evidence And Unknowns
    ## Limitations And Questions

  vision_select_user: |
    You are an expert at reading research papers. I will show you several rendered pages from a PDF.

    Your task is to find the page that contains the model or method architecture diagram. This is the figure that shows the overall structure of the proposed approach, with components, modules, data-flow arrows, and technical labels.

    What counts:
    - Block diagrams showing model components and connections.
    - Flowcharts showing the method pipeline.
    - System schematics with named modules, arrows, or tensor/data annotations.
    - Training or inference pipeline overviews.

    What does not count:
    - Teaser images or qualitative result photos.
    - Bar charts, line plots, scatter plots, or result-only figures.
    - Tables.
    - Title pages or author pages.

    Return only JSON:
    {"index": <int or -1>, "caption": "<caption if readable, otherwise brief description>"}

  vision_fallback_suffix: |
    Visual context: The provided images are rendered PDF pages. Use them to interpret figures, tables, and architecture diagrams.

    Mandatory formatting:
    - Start directly with the metadata JSON block, then "## Abstract".
    - All prose must be in English.
    - Use the exact section headers requested in the main prompt.
    - Explain visual evidence in complete paragraphs.
    - Preserve the Core Snapshot structure.
    - Use Obsidian-compatible math syntax when formulas, objectives, policies, dynamics, or losses are visible in the rendered pages.

  alias_generation_user: |
    Given the following paper, generate 5-10 concise, searchable aliases that other researchers might use to refer to this work.
    Focus on method names, key technical terms, acronyms, and distinctive concepts.

    Title: {title}
    Abstract: {abstract}
    Key innovation: {innovation}

    Return only a JSON array of strings, e.g. ["Alias One", "AliasTwo", "Key_Term"].
    Each alias should be 1-4 words. Prefer English. No duplicates.

rag:
  system: "You are a helpful research assistant."
  retrieve_user: |
    I am analyzing a new paper:
    Title: {title}
    Abstract: {abstract}

    Here is a list of my existing research notes:
    {notes_list}

    Identify the top {k} most relevant notes that I should review to understand the connection between this new paper and my previous knowledge.
    Return only a JSON array of indices, e.g. [0, 5, 12]. If none are relevant, return [].

podcast:
  system: "You are an expert science communicator."
  script_user: |
    You are a professional tech podcaster creating a detailed deep-dive audio segment of about {duration_minutes} minutes.

    Topic: {paper_title}

    Deep analysis report:
    {analysis_content}

    Context from knowledge base:
    {rag_context}

    Aim for about {target_words_min}-{target_words_max} words.
    Write natural spoken English. Be clear, enthusiastic, and critical. Avoid host labels, markdown formatting, and sound-effect notes.
